appId: app.poneglyph.desktop
productName: Poneglyph
directories:
  output: dist/bundles
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - resources/bin/**
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dir
      arch:
        - universal
npmRebuild: false
