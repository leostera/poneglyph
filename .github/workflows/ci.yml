name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout poneglyph
        uses: actions/checkout@v4
        with:
          path: poneglyph

      - name: Checkout datafox sibling
        uses: actions/checkout@v4
        with:
          repository: leostera/datafox
          path: datafox

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: poneglyph -> target

      - name: Check formatting
        working-directory: poneglyph
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: poneglyph
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        working-directory: poneglyph
        run: cargo test --workspace
