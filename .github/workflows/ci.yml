name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: Bun workspace checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout poneglyph
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Node.js for Cloudflare tooling
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and run the unified Vitest battery
        run: bun run check

      - name: Build package and Worker
        run: bun run build

  formal-models:
    name: PlusCal/TLA+ model checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout poneglyph
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download pinned TLA+ tools
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
          echo "7beec0f04818732a62fa193731711a99aa4f11279499b2360a7d156c519ea78d  $RUNNER_TEMP/tla2tools.jar" \
            | sha256sum --check

      - name: Translate PlusCal and check invariants
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: ./specs/check.sh
