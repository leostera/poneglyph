syntax = "proto3";

package poneglyph.daemon.v1;

service PoneglyphDaemon {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc StateFact(StateFactRequest) returns (StateFactResponse);
  rpc StateFactTyped(StateFactTypedRequest) returns (StateFactResponse);
  rpc StateFacts(StateFactsRequest) returns (StateFactResponse);
  rpc StateFactsTyped(StateFactsTypedRequest) returns (StateFactResponse);
  rpc RetractFactById(RetractFactByIdRequest) returns (StateFactResponse);
  rpc ListFacts(ListFactsRequest) returns (JsonResponse);
  rpc ListFactsTyped(ListFactsRequest) returns (ListFactsResponse);
  rpc Query(QueryRequest) returns (JsonResponse);
  rpc QueryTyped(QueryRequest) returns (QueryResponse);
  rpc GetEntity(GetEntityRequest) returns (JsonResponse);
  rpc GetEntityTyped(GetEntityRequest) returns (GetEntityResponse);
  rpc ListEntities(ListEntitiesRequest) returns (JsonResponse);
  rpc ListEntitiesTyped(ListEntitiesRequest) returns (ListEntitiesResponse);
  rpc SearchEntities(SearchEntitiesRequest) returns (JsonResponse);
  rpc SearchEntitiesTyped(SearchEntitiesRequest) returns (SearchEntitiesResponse);
  rpc GetSchema(GetSchemaRequest) returns (JsonResponse);
  rpc GetSchemaTyped(GetSchemaRequest) returns (SchemaDefinition);
}

message StatusRequest {}

message StatusResponse {
  string status = 1;
  string workspace = 2;
  uint64 uptime_seconds = 3;
}

message ShutdownRequest {}

message ShutdownResponse {
  string status = 1;
}

message StateFactRequest {
  string fact_json = 1;
}

message StateFactsRequest {
  repeated string fact_json = 1;
}

message StateFactTypedRequest {
  Fact fact = 1;
}

message StateFactsTypedRequest {
  repeated Fact facts = 1;
}

message RetractFactByIdRequest {
  string fact_id = 1;
}

message ListFactsRequest {
  string entity_uri = 1;
  string tx_id = 2;
  bool active = 3;
  uint64 limit = 4;
  uint64 offset = 5;
}

message StateFactResponse {
  string tx_id = 1;
  string fact_id = 2;
  repeated string fact_ids = 3;
}

// Typed domain payloads for the planned migration away from JsonResponse.
// Current RPCs continue to use JsonResponse until each CLI call site can move
// independently without changing user-facing output.
message Fact {
  string fact_id = 1;
  string source = 2;
  string entity = 3;
  string field = 4;
  Value value = 5;
  bool retraction = 6;
  string stated_at = 7;
  string tx_id = 8;
}

message ActiveFact {
  string fact_id = 1;
  string tx_id = 2;
  string source = 3;
  string entity = 4;
  string field = 5;
  Value value = 6;
}

message ListFactsResponse {
  bool active = 1;
  repeated Fact facts = 2;
  repeated ActiveFact active_facts = 3;
}

message Entity {
  string uri = 1;
  string namespace = 2;
  string kind = 3;
  map<string, Value> fields = 4;
}

message GetEntityResponse {
  Entity entity = 1;
}

message ListEntitiesResponse {
  repeated Entity entities = 1;
}

message SearchHit {
  string entity_uri = 1;
  float score = 2;
}

message SearchEntitiesResponse {
  repeated SearchHit hits = 1;
}

message NamespaceSchema {
  string uri = 1;
  optional string name = 2;
  optional string doc = 3;
}

message KindSchema {
  string uri = 1;
  optional string name = 2;
  optional string doc = 3;
}

message FieldSchema {
  string uri = 1;
  optional string name = 2;
  optional string doc = 3;
  optional string same_as = 4;
  optional string domain = 5;
  optional string range = 6;
  optional string value_type = 7;
  optional string cardinality = 8;
  optional bool deprecated = 9;
  optional bool identity = 10;
}

message SchemaEntries {
  repeated NamespaceSchema namespaces = 1;
  repeated KindSchema kinds = 2;
  repeated FieldSchema fields = 3;
}

message SchemaDefinition {
  SchemaEntries base = 1;
  repeated NamespaceSchema namespaces = 2;
  repeated KindSchema kinds = 3;
  repeated FieldSchema fields = 4;
}

message Value {
  oneof kind {
    NullValue null_value = 1;
    string text = 2;
    string number = 3;
    bool boolean = 4;
    bytes bytes = 5;
    string reference_uri = 6;
    string date = 7;
    string datetime = 8;
    ValueList list = 9;
    ValueMap map = 10;
  }
}

message NullValue {}

message ValueList {
  repeated Value values = 1;
}

message ValueMap {
  map<string, Value> values = 1;
}

message QueryRequest {
  string expression = 1;
}

message QueryResponse {
  repeated QueryRow rows = 1;
}

message QueryRow {
  repeated QueryBinding bindings = 1;
}

message QueryBinding {
  string variable = 1;
  QueryValue value = 2;
}

message QueryValue {
  oneof kind {
    int64 integer = 1;
    string string = 2;
  }
}

message GetEntityRequest {
  string uri = 1;
}

message ListEntitiesRequest {
  uint64 limit = 1;
  uint64 offset = 2;
}

message SearchEntitiesRequest {
  string query = 1;
  uint64 limit = 2;
}

message GetSchemaRequest {}

message JsonResponse {
  string json = 1;
}
