[workspace]
members = [
    "crates/poneglyph-consolidation",
    "crates/poneglyph-core",
    "crates/poneglyph-facts",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "sync"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.17.0", features = ["serde", "v7"] }
