[workspace]
members = [
    "crates/datafox",
    "crates/poneglyph-mcp",
    "crates/poneglyph",
    "crates/poneglyphd",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
async-trait = "0"
chrono = { version = "0", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
datafox = { path = "crates/datafox" }
derive_builder = "0"
futures-util = "0"
poneglyph = { path = "crates/poneglyph" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tantivy = "0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml = { version = "1" }
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
