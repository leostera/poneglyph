[workspace]
members = [
    "crates/poneglyph",
    "crates/poneglyph-local",
    "crates/poneglyph-api",
]
resolver = "2"

[workspace.dependencies]
async-trait = "0"
chrono = { version = "0", features = ["serde"] }
config = "0"
datafox = { path = "../datafox" }
derive_builder = "0"
futures-util = "0"
sha2 = "0.10"
proptest = "1"
regex = "1"
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
sqlx = { version = "0", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tantivy = "0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml = { version = "1" }
tonic = { version = "0.12", features = ["transport"] }
tonic-build = "0.12"
tracing = "0"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
